name: Claude

# Claude runs only when a human writes @claude in a comment. There is no
# trigger on push, on opened issues or on a schedule: every run spends the
# subscription quota, so every run is asked for explicitly.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run at a time. A burst of comments queues instead of multiplying into
# parallel runs against the same quota.
concurrency:
  group: claude
  cancel-in-progress: false

jobs:
  claude:
    # The repository is public, so anyone can comment. The action rejects a
    # commenter without write access on its own, but this keeps a stranger
    # from starting a runner at all.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth, not an API key: runs draw from the plan
          # rather than billing per token. Generated with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --max-turns caps how far a single run can go. Paired with
          # timeout-minutes above, it bounds what one comment can cost.
          #
          # Without --allowedTools the run has no shell at all: the first run
          # could neither execute npm test nor open its own pull request, and
          # said so. The list below is what a run needs to finish a task and
          # check its own work. gh is scoped to pull requests and issues, so a
          # run cannot reach repository administration.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
